---
---
<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ site.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
<aside class="menu" id="menu" aria-label="Menu">
  <div class="mhead">
    <div class="hl"><a class="reset" href="{{ '/' | relative_url }}" id="home-link" aria-label="Reset to home" title="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/></svg></a><button class="ic" id="theme" data-label="Dark mode" aria-label="Dark mode" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 21.5h4"/><path d="M12 2.5a6.5 6.5 0 0 0-4 11.6c.8.7 1.2 1.6 1.3 2.6h5.4c.1-1 .5-1.9 1.3-2.6A6.5 6.5 0 0 0 12 2.5z"/></svg></button></div>
    <button class="arrow" id="hide" aria-controls="menu" aria-label="Hide menu" title="Hide menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 17l-5-5 5-5"/><path d="M18 17l-5-5 5-5"/></svg></button>
  </div>
  <nav class="sect pages" id="pages" aria-label="Pages"></nav>
  <div id="controls" class="sect" hidden>
    <div class="sect">
      <div class="tools">
        <div class="seg" id="motion" role="group" aria-label="Motion">
          <button class="ic" data-m="play" data-label="Play" aria-label="Play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg></button>
          <button class="ic" data-m="pause" data-label="Pause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 5v14M15.5 5v14"/></svg></button>
        </div>
        <div class="seg" id="order" role="group" aria-label="Order">
          <button class="ic" data-o="time" data-label="In order" aria-label="In order"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
          <button class="ic" data-o="shuffle" data-label="Shuffle" aria-label="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h4v4"/><path d="M4 20 20 4"/><path d="M20 16v4h-4"/><path d="M14.5 14.5 20 20"/><path d="M4 4l5 5"/></svg></button>
        </div>
      </div>
    </div>
    <div class="sect" style="margin-top:22px">
      <h2><span>Tags</span><button class="clear" id="clear" hidden>Clear</button></h2>
      <div id="tags" class="sect"></div>
    </div>
  </div>
  <div id="detail" class="detail" hidden></div>
</aside>
<button class="open-menu" id="open" aria-label="Show menu" title="Show menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 17l5-5-5-5"/><path d="M6 17l5-5-5-5"/></svg></button>

<main id="main">
  <div id="v-grid" hidden>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>Nothing tagged with these yet.</div>
  </div>
</main>

<div class="zoom" id="zoom" hidden>
  <div class="stage" id="stage"></div>
  <div class="zcap detail" id="zcap"></div>
</div>

<script>
window.PROJECTS=[];window.ITEMS=[];
{%- assign none = "" | split: "" -%}
{%- assign projects = site.projects | sort: "order" -%}
{%- for p in projects %}
PROJECTS.push({slug:{{ p.slug | jsonify }},title:{{ p.title | jsonify }}});
{%- endfor -%}
{%- assign ups = site.uploads | sort: "date" | reverse -%}
{%- for u in ups -%}
  {%- assign key = u.page | split: "/" | last | remove: ".md" | slugify -%}
  {%- assign ut = u.tags | default: none -%}
  {%- assign notes = u.notes | default: none -%}
  {%- assign files = u.files | default: none -%}
  {%- assign links = u.links | default: none -%}
  {%- assign files = files | concat: links -%}
  {%- assign d = u.date | date: "%Y-%m-%d" -%}
  {%- for f in files -%}
    {%- assign note = nil -%}
    {%- for n in notes -%}{%- if n.file == f or n.link == f -%}{%- assign note = n -%}{%- endif -%}{%- endfor -%}
    {%- assign nt = note.tags | default: none -%}
    {%- assign tl = note.title | default: u.title -%}
    {%- assign cp = note.caption | default: u.caption | default: "" %}
ITEMS.push({p:{{ key | jsonify }},src:{{ f | relative_url | jsonify }},date:{{ d | jsonify }},title:{{ tl | jsonify }},desc:{{ cp | jsonify }},tags:{{ ut | concat: nt | uniq | jsonify }}});
  {%- endfor -%}
  {%- for n in notes -%}
    {%- unless files contains n.file -%}{%- if n.file -%}
    {%- assign nt = n.tags | default: none -%}
    {%- assign tl = n.title | default: u.title -%}
    {%- assign cp = n.caption | default: u.caption | default: "" %}
ITEMS.push({p:{{ key | jsonify }},src:{{ n.file | relative_url | jsonify }},date:{{ d | jsonify }},title:{{ tl | jsonify }},desc:{{ cp | jsonify }},tags:{{ ut | concat: nt | uniq | jsonify }}});
    {%- endif -%}{%- endunless -%}
  {%- endfor -%}
{%- endfor %}
</script>
<script src="{{ '/assets/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
